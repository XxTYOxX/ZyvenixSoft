# ===========================================
# CONFIGURACIÓN UNIFICADA: LOCAL (H2) + PROD (SUPABASE)
# ===========================================
# En local: usa H2 (por defecto)
# En Render: define las 3 env vars y usa PostgreSQL automáticamente
# ===========================================

# --- Servidor ---
server.port=${PORT:8080}

# --- Base de datos ---
# Si defines SPRING_DATASOURCE_URL en env vars → usa PostgreSQL (Supabase)
# Si NO la defines → usa H2 local (desarrollo)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/urbanvogue;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Pool Hikari (solo aplica si hay URL externa)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Dialecto JPA: auto-detecta (H2 o PostgreSQL)
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console: solo en local (si driver es H2)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

