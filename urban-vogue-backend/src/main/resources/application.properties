# --- Servidor ---
server.port=8080

# --- Servidor ---
server.port=${PORT:8080}

# --- Base de datos H2 (archivo local, se crea solo, no requiere instalar nada) ---
# El archivo queda guardado en ./data/urbanvogue.mv.db dentro del proyecto.
spring.datasource.url=jdbc:h2:file:./data/urbanvogue;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver las tablas en el navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

