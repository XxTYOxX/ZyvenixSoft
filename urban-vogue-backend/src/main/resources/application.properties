# ===========================================
# CONFIGURACIÓN ACTUAL: H2 LOCAL (DESARROLLO)
# ===========================================
# Para usar Supabase (producción), renombra este archivo
# y usa application-supabase.properties en su lugar,
# o pasa: --spring.profiles.active=supabase
# ===========================================

# --- Servidor ---
server.port=${PORT:8080}

# --- Base de datos H2 (archivo local, se crea solo) ---
# El archivo queda guardado en ./data/urbanvogue.mv.db dentro del proyecto.
spring.datasource.url=jdbc:h2:file:./data/urbanvogue;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================================
# PARA PRODUCCIÓN CON SUPABASE:
# ===========================================
# 1. Copia application-supabase.properties → application.properties
# 2. Edita las credenciales (TU_PROYECTO, TU_PASSWORD_SUPABASE)
# 3. O usa: java -jar app.jar --spring.profiles.active=supabase
#    (requiere renombrar application-supabase.properties a application-supabase.yml
#     o crear application.yml con spring.config.import)
# ===========================================