# ===========================================
# CONFIGURACIÓN PARA SUPABASE (PRODUCCIÓN)
# ===========================================
# Copia este archivo como application.properties
# o renombra el actual y usa este en su lugar
# ===========================================

# --- Servidor ---
server.port=${PORT:8080}

# --- Base de datos SUPABASE (PostgreSQL) ---
# Obtén estos valores en: Supabase Dashboard → Settings → Database
# Connection pooling: usa el host "db.TU_PROYECTO.supabase.co" puerto 5432
# O pooler: "aws-0-REGION.pooler.supabase.com" puerto 6543
spring.datasource.url=jdbc:postgresql://db.TU_PROYECTO.supabase.co:5432/postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=TU_PASSWORD_SUPABASE

# Pool Hikari (optimizado para Supabase serverless)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=UrbanVogueHikari

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# H2 Console (deshabilitado en prod)
spring.h2.console.enabled=false

# ===========================================
# CÓMO OBTENER CREDENCIALES SUPABASE:
# ===========================================
# 1. Ve a https://supabase.com/dashboard
# 2. Selecciona tu proyecto (o crea uno nuevo)
# 3. Settings → Database
# 4. Copia:
#    - Host: db.xxx.supabase.co
#    - Database name: postgres
#    - Port: 5432
#    - User: postgres
#    - Password: (el que definiste al crear el proyecto)
# 5. Reemplaza TU_PROYECTO y TU_PASSWORD_SUPABASE arriba
# ===========================================